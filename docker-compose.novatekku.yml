# Novatekku deployment on 43.165.129.165.
# Frontend assets are served by nginx from /var/www/novatekku-*.

services:
  db:
    image: postgres:15-alpine
    container_name: novatekku-nova-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-nova_kaitori}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: novatekku-nova-redis
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: novatekku-nova-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-nova_kaitori}
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=https://ai.novatekku.com,https://novakai.net,https://novatekku.com
      - PUBLIC_APP_URL=https://ai.novatekku.com
      - AUTH_ORIGINS=https://ai.novatekku.com,https://novakai.net
      - AUTH_COOKIE_SECURE=true
      - ENVIRONMENT=production
      - CODEX_MODEL=gpt-5.4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  celery:
    build: ./backend
    container_name: novatekku-nova-celery-worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-nova_kaitori}
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      - db
      - redis
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2

  celery-beat:
    build: ./backend
    container_name: novatekku-nova-celery-beat
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-nova_kaitori}
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      - db
      - redis
    command: celery -A app.celery_app beat --loglevel=info

volumes:
  postgres_data:
    name: novatekku_nova_postgres_data
